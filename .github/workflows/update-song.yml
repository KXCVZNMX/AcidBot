name: Update Song Data
run-name: Update Internation Song Data

on:
    schedule:
        # Run at 00:00 UTC every day
        - cron: '0 0 * * *'
    workflow_dispatch:

jobs:
    update-song:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout my repo
              uses: actions/checkout@v4

            - name: Set up pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: '10.33.0'
                  run_install: true

            - name: Install Dependencies
              run: pnpm install

            - name: Clone maimai data repo
              run: git clone https://github.com/zvuc/otoge-db.git

            - name: Set yarn to use Corepack
              run: corepack enable

            - name: Install dependencies
              working-directory: otoge-db
              run: yarn install

            - uses: actions/setup-python@v5
              with:
                  python-version: '3.12'

            - name: Install Python deps and run update
              working-directory: otoge-db
              run: |
                  python -m venv .venv
                  source .venv/bin/activate
                  pip install -r requirements.txt
                  sed -i 's/CURRENT_INTL_VER = "CiRCLE"/CURRENT_INTL_VER = "CiRCLE PLUS"/' scripts/maimai/game.py
                  sed -i "s/var game_version_display_intl = 'CiRCLE'/var game_version_display_intl = 'CiRCLE PLUS'" maimai/src/pug/_maimai_meta.pug
                  yarn clear-const --maimai --intl
                  yarn fetch-intl --maimai
                  rg -n "CURRENT_JP_VER|CURRENT_INTL_VER" scripts/maimai/game.py
                  rg -n "game_version_display|game_version_display_intl" maimai/src/pug/_maimai_meta.pug
                  rg -n "version_list|CiRCLE PLUS" maimai/src/js/maimai.table-config.js

            - name: Get Data and Upload to DB
              working-directory: ./
              env:
                  MONGODB_URI: ${{ secrets.MONGODB_URI }}
              run: |
                  tsc --project tsconfig.scripts.json
                  node ./scripts/parseMaimaiConstants.js
